<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office 工具箱</title>
  <script>
    /* 宿主通过 iframe URL 参数下发当前主题 CSS，挂上它面板才能随主题变色。 */
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        var href = p.get("hana-css");
        var appearance = p.get("hana-theme-appearance");
        if (appearance) {
          var themed = p.get("hana-palette-" + appearance + "-css");
          if (themed) href = themed;
        }
        if (!href) return;
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = href;
        link.setAttribute("data-host-theme", "1");
        document.head.insertBefore(link, document.head.firstChild);
      } catch (e) { /* 主题不可用不影响功能 */ }
    })();
  </script>
  <link rel="stylesheet" href="./assets/panel.css">
</head>
<body>
  <main class="panel" id="panel" aria-busy="true">
    <header class="panel__head">
      <span class="brand" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H13l1.5 2H18.5A1.5 1.5 0 0 1 20 7.5V18a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18z"/>
          <path d="M9 13.5l2 2 4-4.5"/>
        </svg>
      </span>
      <div class="panel__title">
        <h1>Office 工具箱</h1>
        <div class="panel__meta">
          <span class="dot" id="health-dot" aria-hidden="true"></span>
          <span class="tag" id="app-version">v—</span>
        </div>
      </div>
      <button class="btn btn--ghost btn--compact" id="refresh" type="button" title="重新读取状态">刷新</button>
    </header>

    <p class="panel__status" id="startup" role="status">正在连接…</p>

    <!-- 状态段 -->
    <section class="card" id="sec-status" hidden>
      <div class="card__row">
        <div class="card__lead">
          <span class="card__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
          </span>
          <div class="card__label">
            <span class="card__name">officecli</span>
            <span class="card__hint" id="cli-hint">—</span>
          </div>
        </div>
      </div>
    </section>

    <!-- 依赖段 -->
    <section class="card" id="sec-deps" hidden>
      <div class="card__row">
        <div class="card__title">环境依赖</div>
        <button class="btn btn--ghost btn--compact" id="deps-refresh" type="button">重新检查</button>
      </div>
      <p class="card__desc">首次使用或某功能报「未找到」时看这里：LibreOffice 负责转换，officecli 负责 docx/xlsx/pptx 读写，uv 负责文档 MCP。</p>
      <div class="deps" id="deps-list"></div>
    </section>

    <!-- 转换段 -->
    <section class="card" id="sec-convert" hidden>
      <div class="card__title">旧文档转换</div>
      <p class="card__desc">.doc/.rtf→.docx、.xls→.xlsx、.ppt→.pptx（走本机 MS Office）</p>
      <div class="field"><label for="cv-input">输入（文件或目录）</label><input id="cv-input" type="text" placeholder="F:\\path\\to\\folder 或单文件绝对路径"></div>
      <div class="field"><label for="cv-output">输出目录（可空，默认源目录）</label><input id="cv-output" type="text" placeholder="留空则输出到源目录"></div>
      <div class="field-row">
        <div class="field"><label for="cv-mode">原件处理</label>
          <select id="cv-mode">
            <option value="keep">保留原件</option>
            <option value="backup">移入「旧格式文件」</option>
            <option value="replace">删除原件</option>
          </select>
        </div>
        <label class="check"><input id="cv-recursive" type="checkbox" checked> 递归子目录</label>
      </div>
      <div class="card__action-row">
        <button class="btn btn--solid btn--compact" id="cv-run" type="button">开始转换</button>
      </div>
      <section class="confirm-card" id="cv-confirm" hidden role="alertdialog" aria-live="assertive">
        <span>replace 模式会删除源文件；转换失败时原件也可能已受影响。确认继续吗？</span>
        <div class="card__action-row"><button class="btn btn--ghost btn--compact" id="cv-confirm-no" type="button">返回</button><button class="btn btn--danger btn--compact" id="cv-confirm-yes" type="button">确认删除源件并转换</button></div>
      </section>
      <div class="result" id="cv-result" hidden></div>
      <div class="jobs" id="cv-jobs" aria-live="polite"></div>
    </section>

    <!-- 命令段 -->
    <section class="card" id="sec-run" hidden>
      <div class="card__title">执行 officecli 命令</div>
      <p class="card__desc">参数以空格分隔，例如：view a.docx outline · get a.xlsx "/sheet[1]"</p>
      <div class="field"><input id="run-args" type="text" placeholder="get a.docx &quot;/body/p[1]&quot;"></div>
      <div class="card__action-row">
        <button class="btn btn--solid btn--compact" id="run-go" type="button">执行</button>
      </div>
      <div class="result" id="run-result" hidden></div>
    </section>

    <footer class="panel__foot"><span id="updated">—</span></footer>
  </main>

  <script>
    window.addEventListener('error', () => {
      const el = document.getElementById('startup');
      if (el) el.textContent = '面板脚本启动失败，请检查应用资源或运行 App 校验器。';
    }, true);
  </script>
  <script type="module" src="./assets/panel.js"></script>
</body>
</html>
